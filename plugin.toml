[plugin]
summary = 'Casbin RBAC'
version = '0.0.4'
fba_version = ">=2.0.0,<3.0.0"
description = '基于 Casbin 实现的 RBAC 访问控制'
author = 'wu-clan'
tags = ['auth']

[app]
extend = 'admin'

[api.api]
prefix = '/apis'
tags = '系统API'

[api.casbin]
prefix = '/casbin'
tags = '系统Casbin权限'

[settings]
RBAC_CASBIN_EXCLUDE = [
    'POST /api/v1/auth/logout',
]
